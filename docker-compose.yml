services:
  web:
    build: .
    container_name: flask_app
    restart: always
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: flask_db
    restart: always
    environment:
      POSTGRES_DB: alestur_db
      POSTGRES_USER: alestur_user
      POSTGRES_PASSWORD: superpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:latest
    container_name: flask_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/APIWPALESTUR/archivos:/var/www/APIWPALESTUR/archivos:ro

  cron:
    build: .
    container_name: flask_cron
    restart: always
    env_file:
      - .env
    depends_on:
      - db
      - web
    command: >
      sh -c "while true; do python cron_close_sessions.py; sleep 60; done"


  wppconnect:
    build:
      context: ./wppconnect-server
    container_name: wppconnect
    restart: always
    environment:
      WPPCONNECT_PACKAGE_VERSION: ${WPPCONNECT_PACKAGE_VERSION:-2.2.4}
      WPPCONNECT_WHATSAPP_VERSION: ${WPPCONNECT_WHATSAPP_VERSION:-2.3000.1044015310-alpha}
    entrypoint:
      - sh
      - -c
      - >
        if [ -n "$$WPPCONNECT_PACKAGE_VERSION" ]; then
          echo "[wppconnect] Updating @wppconnect-team/wppconnect to $$WPPCONNECT_PACKAGE_VERSION";
          yarn add "@wppconnect-team/wppconnect@$$WPPCONNECT_PACKAGE_VERSION";
        fi;
        node -e "const v=process.env.WPPCONNECT_WHATSAPP_VERSION;
        if (v) {
          const m=require('./dist/config.js');
          const c=m.default||m;
          c.createOptions=c.createOptions||{};
          c.createOptions.whatsappVersion=v;
          console.log('[wppconnect] Using WhatsApp Web version: '+v);
        }
        require('./dist/server.js');"
    ports:
      - "21465:21465"
    volumes:
      - wppconnect_tokens:/usr/src/wpp-server/tokens
      - wppconnect_user_data:/usr/src/wpp-server/userDataDir
volumes:
  postgres_data:
  wppconnect_tokens:
  wppconnect_user_data:
